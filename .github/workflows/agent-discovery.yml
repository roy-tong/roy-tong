name: Agent discovery snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1'

concurrency:
  group: agent-discovery-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate observable discovery report
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
        run: |
          report="metrics/$(date -u +%F).md"
          scripts/agent-discovery-report.sh > "$report"
      - name: Commit a changed snapshot
        run: |
          if [[ -z "$(git status --porcelain -- metrics)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git commit -m "metrics: record weekly Agent discovery snapshot"
          git push
